services:
  proxy:                        # reverse proxy + portal
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"                 # ¿Puerto 80 ocupado en tu PC? Usa otro: "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # la configuración
      - ./web:/usr/share/nginx/html/web:ro                   # la web del portal
      - ./intranet:/usr/share/nginx/html/intranet:ro                   # la web del portal
